<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HBO Max Speed</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="header">
        <h1 class="title">HBO Max Speed</h1>
        <p class="status" id="status-pill" role="status">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="status-text">Looking for HBO Max…</span>
        </p>
      </header>

      <section class="readout" aria-label="Current speed">
        <output class="live-speed" id="live-speed" aria-live="polite">1.0x</output>
        <button type="button" class="reset-btn" id="reset-btn" title="Back to normal speed (\)">
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
            <path d="M3.5 6.5A5 5 0 1 1 3 9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            <path d="M3 3v3.5h3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span>Reset to 1.0x</span>
        </button>
      </section>

      <div class="segmented" id="favorites-grid" role="group" aria-label="Favorite speeds"></div>

      <section class="fine" aria-label="Fine tune">
        <button type="button" class="step-btn" id="step-down-btn" title="Slower by 0.05x" aria-label="Slower by 0.05x">
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
            <path d="M3.5 8h9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          </svg>
        </button>
        <div class="slider-wrap">
          <input
            type="range"
            id="speed-slider"
            class="speed-slider"
            min="0.25"
            max="4"
            step="0.05"
            value="1"
            aria-label="Playback speed"
          />
          <div class="slider-scale" aria-hidden="true">
            <span>0.25x</span>
            <span>4x</span>
          </div>
        </div>
        <button type="button" class="step-btn" id="step-up-btn" title="Faster by 0.05x" aria-label="Faster by 0.05x">
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
            <path d="M3.5 8h9M8 3.5v9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          </svg>
        </button>
      </section>

      <section class="settings" aria-label="Preferences">
        <label class="toggle-row" for="toggle-remember">
          <span class="toggle-text">
            <span class="toggle-label">Remember speed</span>
            <span class="toggle-help">Keep it for the next episode</span>
          </span>
          <input type="checkbox" role="switch" id="toggle-remember" class="toggle-input" />
          <span class="toggle-switch" aria-hidden="true"></span>
        </label>
        <label class="toggle-row" for="toggle-overlay">
          <span class="toggle-text">
            <span class="toggle-label">Speed button on player</span>
            <span class="toggle-help">Shows while the mouse moves</span>
          </span>
          <input type="checkbox" role="switch" id="toggle-overlay" class="toggle-input" />
          <span class="toggle-switch" aria-hidden="true"></span>
        </label>
        <label class="toggle-row" for="toggle-keyboard">
          <span class="toggle-text">
            <span class="toggle-label">Keyboard shortcuts</span>
            <span class="toggle-help">Work anywhere on the HBO Max page</span>
          </span>
          <input type="checkbox" role="switch" id="toggle-keyboard" class="toggle-input" />
          <span class="toggle-switch" aria-hidden="true"></span>
        </label>
      </section>

      <footer class="footer" aria-label="Keyboard shortcuts">
        <span><kbd>[</kbd><kbd>]</kbd> step speed</span>
        <span><kbd>\</kbd> 1.0x toggle</span>
        <span><kbd>Alt</kbd><kbd>1–5</kbd> presets</span>
      </footer>
    </main>

    <script src="../shared/speed-utils.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
