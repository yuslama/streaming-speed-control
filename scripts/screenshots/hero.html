<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Hero</title>
    <style>
      html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
      body {
        display: grid; grid-template-columns: 1fr 340px; gap: 48px; align-items: center;
        padding: 0 88px; box-sizing: border-box;
        background: #0f0f11; color: #ededef;
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .name { display: flex; align-items: center; gap: 14px; font-size: 20px; font-weight: 600; color: #a0a0a8; }
      .name img { width: 48px; height: 48px; }
      h1 { margin: 28px 0 18px; font-size: 64px; line-height: 1.02; letter-spacing: -0.035em; font-weight: 700; color: #fff; }
      p { margin: 0; max-width: 700px; font-size: 21px; color: #a0a0a8; }
      .services { display: grid; grid-template-columns: repeat(4, 150px); gap: 10px; margin: 36px 0 0; padding: 0; list-style: none; }
      .services li { display: flex; align-items: center; justify-content: center; height: 64px; border-radius: 12px; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.1); }
      .services img { display: block; max-width: 104px; max-height: 30px; }
      .services img.tall { max-height: 40px; }
      iframe { width: 320px; height: 434px; border: 0; border-radius: 14px; box-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 30px 80px rgba(0,0,0,.6); background: #161618; }
    </style>
  </head>
  <body>
    <div>
      <div class="name"><img src="/icons/icon128.png" alt="" />Streaming Speed Control</div>
      <h1>Speed control for<br />your streaming apps.</h1>
      <p>1.25x, 1.5x, 1.75x or 2x in one click, or anything from 0.25x to 4x.</p>
      <ul class="services"><li style="background: #000000"><img class="tall" src="/docs/images/services/hbomax-dark.svg" alt="HBO Max" /></li><li style="background: #000000"><img src="/docs/images/services/netflix.svg" alt="Netflix" /></li><li style="background: #000000"><img src="/docs/images/services/hulu.svg" alt="Hulu" /></li><li style="background: #00A8E1"><img src="/docs/images/services/primevideo-dark.svg" alt="Prime Video" /></li><li style="background: linear-gradient(160deg, #0b2a7a, #040b2e)"><img class="tall" src="/docs/images/services/disneyplus-dark.svg" alt="Disney+" /></li><li style="background: #0064FF"><img src="/docs/images/services/paramountplus-dark.svg" alt="Paramount+" /></li><li style="background: #000000"><img src="/docs/images/services/peacock-dark.svg" alt="Peacock" /></li><li style="background: #000000"><img src="/docs/images/services/appletv-dark.svg" alt="Apple TV" /></li></ul>
    </div>
    <iframe src="popup.html?state=active&speed=1.5&url=https://www.netflix.com/watch/demo"></iframe>
  </body>
</html>
