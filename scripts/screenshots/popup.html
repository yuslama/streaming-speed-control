<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Popup</title>
    <link rel="stylesheet" href="/src/popup/popup.css" />
    <!-- Screenshots must show the settled state, not a transition frame. -->
    <style>*, *::before, *::after { transition: none !important; }</style>
    <script src="stub.js"></script>
  </head>
  <body>
    <script>
      // Load the real popup markup and scripts.
      fetch('/src/popup/popup.html')
        .then((r) => r.text())
        .then((html) => {
          const doc = new DOMParser().parseFromString(html, 'text/html');
          document.body.innerHTML = doc.body.querySelector('main').outerHTML;
          for (const src of ['/src/shared/speed-utils.js', '/src/popup/popup.js']) {
            const s = document.createElement('script');
            s.src = src;
            s.async = false;
            document.body.appendChild(s);
          }
        });
    </script>
  </body>
</html>
