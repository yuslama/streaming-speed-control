<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Overlay</title>
    <style>
      /* Player frame: a film still (still.jpg) behind the real overlay. */
      html, body { margin: 0; height: 100%; overflow: hidden; font: 13px -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
      body { background: #000 url(still.jpg) center / cover no-repeat; }
      .controls { position: fixed; left: 0; right: 0; bottom: 0; padding: 60px 32px 22px; background: linear-gradient(transparent, rgba(0,0,0,.7)); color: #fff; }
      .bar { height: 4px; border-radius: 2px; background: rgba(255,255,255,.25); }
      .bar i { display: block; width: 46%; height: 4px; border-radius: 2px; background: #fff; }
      .time { display: flex; justify-content: space-between; margin-top: 10px; opacity: .8; font-variant-numeric: tabular-nums; }
    </style>
  </head>
  <body>
    <div class="controls"><div class="bar"><i></i></div><div class="time"><span>1:16:20</span><span>2:46:00</span></div></div>
    <script src="/src/shared/speed-utils.js"></script>
    <script src="/src/content/overlay-ui.js"></script>
    <script>
      const params = new URLSearchParams(location.search);
      const ui = new HboMaxOverlayUI.SpeedOverlayUI({
        onSelectSpeed: (r) => ui.setState({ speed: r }),
        onStepSpeed: (d, fine) => ui.setState({ speed: ui.speed + d * (fine ? 0.05 : 0.25) }),
      });
      ui.setState({ speed: Number(params.get('speed') || 1.5), hasVideo: true, visible: true });
      clearTimeout(ui._inactivityTimer);
      if (params.has('open')) { ui.isOpen = true; ui._render(); }
      if (params.has('toast')) { ui.showToast(); clearTimeout(ui._toastTimer); }
    </script>
  </body>
</html>
