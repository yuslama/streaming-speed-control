<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Services</title>
    <style>
      html, body { margin: 0; width: 960px; height: 112px; overflow: hidden; background: #0f0f11; }
      ul { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; margin: 0; padding: 16px; list-style: none; box-sizing: border-box; height: 100%; align-items: center; }
      li { display: flex; align-items: center; justify-content: center; height: 100%; border-radius: 14px; background: #1f1f22; }
      img { display: block; max-width: 92px; max-height: 26px; filter: brightness(0) invert(1); }
      img.tall { max-height: 38px; }
    </style>
  </head>
  <body>
    <ul>
      <li><img class="tall" src="/docs/images/services/hbomax.svg" alt="HBO Max" /></li>
      <li><img src="/docs/images/services/netflix.svg" alt="Netflix" /></li>
      <li><img src="/docs/images/services/hulu.svg" alt="Hulu" /></li>
      <li><img src="/docs/images/services/primevideo.svg" alt="Prime Video" /></li>
      <li><img class="tall" src="/docs/images/services/disneyplus.svg" alt="Disney+" /></li>
      <li><img src="/docs/images/services/paramountplus.svg" alt="Paramount+" /></li>
      <li><img src="/docs/images/services/peacock.svg" alt="Peacock" /></li>
    </ul>
  </body>
</html>
