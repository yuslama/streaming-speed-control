<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Services</title>
    <style>
      html, body { margin: 0; width: 960px; height: 112px; overflow: hidden; background: #0f0f11; }
      ul { display: grid; grid-template-columns: repeat(8, 1fr); gap: 10px; margin: 0; padding: 16px; list-style: none; box-sizing: border-box; height: 100%; align-items: center; }
      li { display: flex; align-items: center; justify-content: center; height: 100%; border-radius: 14px; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.1); }
      img { display: block; max-width: 84px; max-height: 26px; }
      img.tall { max-height: 38px; }
    </style>
  </head>
  <body>
    <ul>
      <li style="background: #000000"><img class="tall" src="/docs/images/services/hbomax-dark.svg" alt="HBO Max" /></li>
      <li style="background: #000000"><img src="/docs/images/services/netflix.svg" alt="Netflix" /></li>
      <li style="background: #000000"><img src="/docs/images/services/hulu.svg" alt="Hulu" /></li>
      <li style="background: #00A8E1"><img src="/docs/images/services/primevideo-dark.svg" alt="Prime Video" /></li>
      <li style="background: linear-gradient(160deg, #0b2a7a, #040b2e)"><img class="tall" src="/docs/images/services/disneyplus-dark.svg" alt="Disney+" /></li>
      <li style="background: #0064FF"><img src="/docs/images/services/paramountplus-dark.svg" alt="Paramount+" /></li>
      <li style="background: #000000"><img src="/docs/images/services/peacock-dark.svg" alt="Peacock" /></li>
      <li style="background: #000000"><img src="/docs/images/services/appletv-dark.svg" alt="Apple TV" /></li>
    </ul>
  </body>
</html>
